name: Status dry-run (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: logistic-status-dry-run
  cancel-in-progress: false

jobs:
  status-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      ORDERS_SPREADSHEET_NAME: Orders
      NOVA_POSHTA_API_KEY: ${{ secrets.NOVA_POSHTA_API_KEY }}
      UP_TRACKING_TOKEN: ${{ secrets.UP_TRACKING_TOKEN }}
      UP_USER_TOKEN: ${{ secrets.UP_USER_TOKEN }}
      UP_BEARER_TOKEN: ${{ secrets.UP_BEARER_TOKEN }}
      UP_UUID: ${{ secrets.UP_UUID }}
      UP_UUID_SAND: ${{ secrets.UP_UUID_SAND }}
      UP_COUNTERPARTY_TOKEN: ${{ secrets.UP_COUNTERPARTY_TOKEN }}

    steps:
      - name: Read repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Check required read-only secrets
        shell: bash
        run: |
          missing=0
          if [ -z "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing GCP_SERVICE_ACCOUNT_JSON"
            missing=1
          fi
          if [ -z "$NOVA_POSHTA_API_KEY" ]; then
            echo "::error::Missing NOVA_POSHTA_API_KEY"
            missing=1
          fi
          if [ -z "$UP_TRACKING_TOKEN" ]; then
            echo "::error::Missing UP_TRACKING_TOKEN"
            missing=1
          fi
          exit "$missing"

      - name: Read five rows and show proposed status changes
        run: python scripts/status_dry_run.py --limit 5
