name: Background status + receipts (every 10 minutes)

on:
  schedule:
    # Не ставимо на :00/:10 — GitHub попереджає про затримки та втрату jobs у пікові хвилини.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: logistic-status-canary
  cancel-in-progress: false

jobs:
  status-background:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      GCP_SERVICE_ACCOUNT_TOML: ${{ secrets.GCP_SERVICE_ACCOUNT_TOML }}
      ORDERS_SPREADSHEET_NAME: Orders
      NOVA_POSHTA_API_KEY: ${{ secrets.NOVA_POSHTA_API_KEY }}
      UP_TRACKING_TOKEN: ${{ secrets.UP_TRACKING_TOKEN }}
      UP_USER_TOKEN: ${{ secrets.UP_USER_TOKEN }}
      UP_BEARER_TOKEN: ${{ secrets.UP_BEARER_TOKEN }}
      UP_UUID: ${{ secrets.UP_UUID }}
      UP_UUID_SAND: ${{ secrets.UP_UUID_SAND }}
      UP_COUNTERPARTY_TOKEN: ${{ secrets.UP_COUNTERPARTY_TOKEN }}
      UP_TRACKING_REQUEST_TIMEOUT_SECONDS: "15"
      TURBOSMS_TOKEN: ${{ secrets.TURBOSMS_TOKEN }}
      TURBOSMS_SENDER: ${{ secrets.TURBOSMS_SENDER }}
      PROM_UA_TOKEN: ${{ secrets.PROM_UA_TOKEN }}

    steps:
      - name: Read repository main branch
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Check required secrets
        shell: bash
        run: |
          missing=0
          if [ -z "$GCP_SERVICE_ACCOUNT_JSON" ] && [ -z "$GCP_SERVICE_ACCOUNT_TOML" ]; then
            echo "::error::Missing GCP_SERVICE_ACCOUNT_TOML or GCP_SERVICE_ACCOUNT_JSON"
            missing=1
          fi
          if [ -z "$NOVA_POSHTA_API_KEY" ]; then
            echo "::error::Missing NOVA_POSHTA_API_KEY"
            missing=1
          fi
          if [ -z "$UP_TRACKING_TOKEN" ]; then
            echo "::error::Missing UP_TRACKING_TOKEN"
            missing=1
          fi
          exit "$missing"

      - name: Write at most five Nova Poshta and five Ukrposhta status/date updates
        run: >-
          python scripts/status_canary.py
          --candidate-limit 10
          --candidate-offset-per-service "$(( (GITHUB_RUN_NUMBER - 1) * 10 ))"
          --max-updates-per-service 5
          --up-workers 4
          --apply
          --confirmation WRITE-5-NP-5-UP

      - name: Fill at most twenty missing Ukrposhta invoice numbers
        continue-on-error: true
        run: >-
          python scripts/up_invoice_background.py
          --limit 20
          --apply
          --confirmation FILL-UP-INVOICES-20

      - name: Send at most five due Ukrposhta TTNs to Prom.ua
        if: ${{ env.PROM_UA_TOKEN != '' }}
        run: >-
          python scripts/prom_ttn_background.py
          --limit 5
          --apply
          --confirmation SEND-PROM-TTNS-5

      - name: Preview at most three ready receipts without SMS
        run: python scripts/receipt_background.py --limit 3

      - name: Send and remove at most three ready receipts
        if: ${{ env.TURBOSMS_TOKEN != '' }}
        run: >-
          python scripts/receipt_background.py
          --limit 3
          --apply
          --confirmation SEND-RECEIPTS-3
