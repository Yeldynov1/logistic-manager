name: Status canary write (manual, status/date only)

on:
  workflow_dispatch:
    inputs:
      confirm_status_date_only:
        description: "I confirm: update only Status/Date for max 1 NP + 1 UP"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: logistic-status-canary
  cancel-in-progress: false

jobs:
  status-canary-write:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      GCP_SERVICE_ACCOUNT_TOML: ${{ secrets.GCP_SERVICE_ACCOUNT_TOML }}
      ORDERS_SPREADSHEET_NAME: Orders
      NOVA_POSHTA_API_KEY: ${{ secrets.NOVA_POSHTA_API_KEY }}
      UP_TRACKING_TOKEN: ${{ secrets.UP_TRACKING_TOKEN }}
      UP_USER_TOKEN: ${{ secrets.UP_USER_TOKEN }}
      UP_BEARER_TOKEN: ${{ secrets.UP_BEARER_TOKEN }}
      UP_UUID: ${{ secrets.UP_UUID }}
      UP_UUID_SAND: ${{ secrets.UP_UUID_SAND }}
      UP_COUNTERPARTY_TOKEN: ${{ secrets.UP_COUNTERPARTY_TOKEN }}
      CONFIRM_STATUS_DATE_ONLY: ${{ inputs.confirm_status_date_only }}

    steps:
      - name: Read repository main branch
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Require explicit status/date confirmation
        shell: bash
        run: |
          if [ "$CONFIRM_STATUS_DATE_ONLY" != "true" ]; then
            echo "::error::Canary write requires explicit Status/Date confirmation"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Check required secrets
        shell: bash
        run: |
          missing=0
          if [ -z "$GCP_SERVICE_ACCOUNT_JSON" ] && [ -z "$GCP_SERVICE_ACCOUNT_TOML" ]; then
            echo "::error::Missing GCP_SERVICE_ACCOUNT_TOML or GCP_SERVICE_ACCOUNT_JSON"
            missing=1
          fi
          if [ -z "$NOVA_POSHTA_API_KEY" ]; then
            echo "::error::Missing NOVA_POSHTA_API_KEY"
            missing=1
          fi
          if [ -z "$UP_TRACKING_TOKEN" ]; then
            echo "::error::Missing UP_TRACKING_TOKEN"
            missing=1
          fi
          exit "$missing"

      - name: Write at most one Nova Poshta and one Ukrposhta status/date update
        run: >-
          python scripts/status_canary.py
          --candidate-limit 5
          --apply
          --confirmation WRITE-1-NP-1-UP
