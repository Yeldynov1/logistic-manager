name: Delayed Prom.ua Ukrposhta TTNs (every 10 minutes)

on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: logistic-prom-ttn-background
  cancel-in-progress: false

jobs:
  send-prom-ttns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      GCP_SERVICE_ACCOUNT_TOML: ${{ secrets.GCP_SERVICE_ACCOUNT_TOML }}
      ORDERS_SPREADSHEET_NAME: Orders
      PROM_UA_TOKEN: ${{ secrets.PROM_UA_TOKEN }}

    steps:
      - name: Read repository main branch
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Check required secrets
        shell: bash
        run: |
          missing=0
          if [ -z "$GCP_SERVICE_ACCOUNT_JSON" ] && [ -z "$GCP_SERVICE_ACCOUNT_TOML" ]; then
            echo "::error::Missing GCP_SERVICE_ACCOUNT_TOML or GCP_SERVICE_ACCOUNT_JSON"
            missing=1
          fi
          if [ -z "$PROM_UA_TOKEN" ]; then
            echo "::error::Missing PROM_UA_TOKEN"
            missing=1
          fi
          exit "$missing"

      - name: Send at most five due Ukrposhta TTNs to Prom.ua
        run: >-
          python scripts/prom_ttn_background.py
          --limit 5
          --apply
          --confirmation SEND-PROM-TTNS-5
